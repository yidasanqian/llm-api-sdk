name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21', '25']
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Verify SDK
        run: mvn --batch-mode --no-transfer-progress verify
      - name: Install SDK artifacts
        run: mvn --batch-mode --no-transfer-progress -Dmaven.test.skip=true install
      - name: Verify standalone consumer
        run: mvn --batch-mode --no-transfer-progress -f examples/basic/pom.xml test
