name: Release to Maven Central
run-name: Release ${{ github.event.inputs.tag || github.ref_name }}
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing immutable release tag, for example v0.2.0'
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: maven-central-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: maven-central
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false
      - name: Set up Java and Central credentials
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          server-id: central
          server-username-env-var: CENTRAL_USERNAME
          server-password-env-var: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase-env-var: MAVEN_GPG_PASSPHRASE
      - name: Check Central credentials
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
        run: |
          test -n "$CENTRAL_USERNAME" || { echo "::error::CENTRAL_USERNAME is empty"; exit 1; }
          test -n "$CENTRAL_PASSWORD" || { echo "::error::CENTRAL_PASSWORD is empty"; exit 1; }
          [[ ! "$CENTRAL_USERNAME" =~ [[:space:]] ]] || { echo "::error::CENTRAL_USERNAME contains whitespace"; exit 1; }
          [[ ! "$CENTRAL_PASSWORD" =~ [[:space:]] ]] || { echo "::error::CENTRAL_PASSWORD contains whitespace"; exit 1; }
          echo "CENTRAL_USERNAME length: ${#CENTRAL_USERNAME}"
          echo "CENTRAL_PASSWORD length: ${#CENTRAL_PASSWORD}"
      - name: Check release coordinates
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version=$(mvn -q -N help:evaluate -Dexpression=project.version -DforceStdout)
          test "v$version" = "$RELEASE_TAG"
      - name: Build, sign and publish
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: mvn --batch-mode --no-transfer-progress -Prelease deploy
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: gh release create "$RELEASE_TAG" --verify-tag --generate-notes --latest --title "$RELEASE_TAG"
